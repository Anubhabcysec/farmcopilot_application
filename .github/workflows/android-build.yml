name: Build Android APK

# Produces a real, installable debug APK from frontend/ + the Capacitor
# android/ project. Runs on GitHub's own runners, which (unlike some
# sandboxed dev environments) have normal internet access to
# dl.google.com / maven.google.com, so the Android Gradle Plugin and SDK
# components resolve normally here.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on every push to main that touches frontend/**.
# The finished APK is attached to the workflow run as a downloadable
# artifact — Actions tab -> this run -> Artifacts -> farm-copilot-debug-apk.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      # Plain `npm run build` (NOT build:android/.env.android) on purpose:
      # with no VITE_API_URL set, frontend/src/config.js falls back to the
      # real deployed backend (https://farm-copilot-backend.onrender.com)
      # for any native Android build. That means this APK works straight
      # off your phone's normal Wi-Fi/mobile data, needs no LAN setup, and
      # talks to the exact same backend + database as the website — same
      # accounts, same data, everything you do in the app shows up on the
      # web and vice versa.
      #
      # If you specifically want a build that hits your LOCAL dev backend
      # instead (for testing backend changes before they're deployed), use
      # `npm run build:android` here and edit frontend/.env.android's
      # VITE_API_URL to your computer's LAN IP first — see ANDROID.md
      # section 7. That only works while your phone and computer share the
      # same Wi-Fi network.
      #
      # VITE_GOOGLE_MAPS_API_KEY: frontend/.env (which holds this) is
      # git-ignored on purpose — it's never pushed to GitHub — so it has to
      # be supplied here instead, from a repository secret, or the Maps
      # features in LocationField/AuthModal/Treatment will silently render
      # blank in the built APK. Add it once: repo Settings -> Secrets and
      # variables -> Actions -> New repository secret -> name it
      # VITE_GOOGLE_MAPS_API_KEY -> paste the same key from your local
      # frontend/.env. See ANDROID.md section 4a.
      - name: Build web assets
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-copilot-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
